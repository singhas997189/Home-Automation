<style>
:root{--bg:#0F1219;--surface:#181D29;--card:#1B2130;--card2:#212739;--border:#2A3145;--soft:#232A3B;--text:#EDEFF6;--muted:#8B90A8;--faint:#5B6178;--wifi:#5B8CFF;--bt:#B48CFF;--amber:#FFB454;--green:#4ADE80;--red:#FF6B6B}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;background:#05060A;display:flex;align-items:center;justify-content:center;padding:24px 12px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--text)}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace}
.phone{width:390px;height:800px;border-radius:44px;background:#000;padding:12px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.screen{width:100%;height:100%;border-radius:34px;overflow:hidden;background:radial-gradient(circle at 50% -10%,#1B2030 0%,#0F1219 55%);position:relative;display:flex;flex-direction:column}
.notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:120px;height:22px;background:#000;border-radius:0 0 14px 14px;z-index:30}
.statusbar{display:flex;justify-content:space-between;padding:12px 24px 4px;font-size:12px;font-family:ui-monospace,Menlo,Consolas,monospace}
.content{flex:1;overflow-y:auto;padding:4px 20px 14px;position:relative}
.content::-webkit-scrollbar{display:none}
@media(max-width:500px){body{padding:0;display:block}.phone{width:100%;height:100vh;height:100dvh;border-radius:0;padding:0;box-shadow:none}.screen{border-radius:0}.notch,.statusbar{display:none}.content{padding-top:max(16px,env(safe-area-inset-top))}}
h1{font-size:22px;font-weight:650;margin:8px 0 2px}
.sub{font-size:13px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--soft);border-radius:16px;padding:16px;margin-bottom:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.head{display:flex;align-items:center;gap:12px}
.ic{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:17px;background:var(--surface);flex-shrink:0}
.name{font-size:14px;font-weight:600}
.meta{font-size:10px;color:var(--faint);margin-top:2px;letter-spacing:.3px}
.pill{font-size:10px;font-weight:700;padding:3px 9px;border-radius:999px;letter-spacing:.3px}
.p-ok{background:#4ADE8022;color:var(--green)}.p-warn{background:#FFB45422;color:var(--amber)}.p-bad{background:#FF6B6B22;color:var(--red)}.p-idle{background:#8B90A822;color:var(--muted)}
.tg{width:44px;height:25px;border-radius:999px;background:var(--border);position:relative;cursor:pointer;flex-shrink:0;transition:background .2s;border:0;padding:0}
.tg.on{background:var(--amber)}
.tg i{position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.tg.on i{left:22px}
.lock{width:100%;border:0;cursor:pointer;border-radius:12px;padding:11px;font-size:13px;font-weight:600;font-family:inherit}
input[type=text]{width:100%;background:var(--surface);border:1px solid var(--border);color:var(--text);padding:12px;border-radius:10px;font-size:15px;margin-top:8px;font-family:ui-monospace,Menlo,Consolas,monospace;text-transform:uppercase;letter-spacing:.5px}
input.host{text-transform:none;font-size:13px}
.btn{border:0;cursor:pointer;font-weight:600;font-size:13px;border-radius:999px;padding:11px 18px;font-family:inherit}
.b-pri{background:var(--wifi);color:#fff}.b-bt{background:var(--bt);color:#fff}.b-gh{background:var(--surface);color:var(--text);border:1px solid var(--border)}.b-red{background:#FF6B6B22;color:var(--red)}
.btn:disabled{opacity:.5}
.steps{font-size:13px;color:var(--muted);line-height:1.75;margin:10px 0 0;padding-left:18px}
.steps b{color:var(--text)}
.lbl{font-size:10px;color:var(--faint);letter-spacing:.6px;margin:16px 0 8px}
.tabs{display:flex;justify-content:space-around;border-top:1px solid var(--soft);background:var(--surface);padding:10px 0 calc(14px + env(safe-area-inset-bottom))}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;width:70px;background:none;border:0;cursor:pointer;color:var(--faint);font-family:inherit}
.tab.a{color:var(--text)}.tab .e{font-size:18px}.tab .t{font-size:10px;font-weight:600}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:var(--card2);border:1px solid var(--border);padding:9px 16px;border-radius:999px;font-size:12px;z-index:99;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
.scan{position:fixed;inset:0;background:#000d;z-index:80;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.scan video{width:min(88vw,380px);border-radius:16px;border:2px solid var(--wifi)}
.fade{animation:f .3s ease}@keyframes f{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>
</head>

  <div class="notch"></div>
  <div class="statusbar"><span id="clock"></span><span id="net"></span></div>
  <div class="content" id="content"></div>
  <div class="tabs">
    <button class="tab a" id="t-home" onclick="setTab('home')"><span class="e">🏠</span><span class="t">Home</span></button>
    <button class="tab" id="t-set" onclick="setTab('settings')"><span class="e">⚙️</span><span class="t">Settings</span></button>
  </div>
</div></div>

    for(let i=16;i<64;i++){
      const a=w[i-15],b=w[i-2];
      const s0=((a>>>7)|(a<<25))^((a>>>18)|(a<<14))^(a>>>3);
      const s1=((b>>>17)|(b<<15))^((b>>>19)|(b<<13))^(b>>>10);
      w[i]=(w[i-16]+s0+w[i-7]+s1)>>>0;
    }
    let a=H[0],b=H[1],c=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
    for(let i=0;i<64;i++){
      const S1=((e>>>6)|(e<<26))^((e>>>11)|(e<<21))^((e>>>25)|(e<<7));
      const ch=(e&f)^(~e&g);
      const t1=(h+S1+ch+K256[i]+w[i])>>>0;
      const S0=((a>>>2)|(a<<30))^((a>>>13)|(a<<19))^((a>>>22)|(a<<10));
      const mj=(a&b)^(a&c)^(b&c);
      const t2=(S0+mj)>>>0;
      h=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=b;b=a;a=(t1+t2)>>>0;
    }
    H[0]=(H[0]+a)>>>0;H[1]=(H[1]+b)>>>0;H[2]=(H[2]+c)>>>0;H[3]=(H[3]+d)>>>0;
    H[4]=(H[4]+e)>>>0;H[5]=(H[5]+f)>>>0;H[6]=(H[6]+g)>>>0;H[7]=(H[7]+h)>>>0;
  }
  const out=new Uint8Array(32), o=new DataView(out.buffer);
  H.forEach((v,i)=>o.setUint32(i*4,v)); return out;
}
function cat(a,b){const r=new Uint8Array(a.length+b.length);r.set(a);r.set(b,a.length);return r}
function hmac(key,msg){
  if(key.length>64) key=sha256(key);
  const k=new Uint8Array(64); k.set(key);
  return sha256(cat(k.map(x=>x^0x5c), sha256(cat(k.map(x=>x^0x36), msg))));
}
//CRYPTO-END

/* ---------------- state ---------------- */
let dev=null; try{dev=JSON.parse(localStorage.getItem('hearth_dev')||'null')}catch(e){}
let tab='home', conn='idle', transport=null, hw={light:0,plug:0,lock:1,lockEnabled:0};
let base='', hostOverride=localStorage.getItem('hearth_host')||'', poll=null, ble=null, toastT=null, hostedBy=null;
const canBle=!!navigator.bluetooth && window.isSecureContext;
const DEVS=[
  {k:'light',name:'Entry Light',icon:'💡',room:'Entryway',type:'toggle'},
  {k:'plug',name:'Coffee Maker',icon:'🔌',room:'Kitchen',type:'toggle'},
  {k:'lock',name:'Front Door',icon:'🔒',room:'Entryway',type:'lock'}];

/* ---------------- key handling ---------------- */
function parseKey(t){
  t=String(t||'').trim();
  let m=t.match(/S:Hearth-([0-9A-F]{6});P:([A-Z0-9]{12});/i);
  if(m) return {id:m[1].toUpperCase(),code:m[2].toUpperCase()};
  const s=t.toUpperCase().replace(/[^A-Z0-9]/g,'');
  return s.length===18?{id:s.slice(0,6),code:s.slice(6)}:null;
}
function addDevice(p){
  // store only the derived control key — never the AP/setup code itself
  const ctl=hex(hmac(enc(p.code),enc('hearth-ctl-v1')));
  dev={id:p.id,ctl}; localStorage.setItem('hearth_dev',JSON.stringify(dev));
}
function forget(){
  if(!confirm('Remove this device from this browser? You will need the key from the label to add it again.'))return;
  localStorage.removeItem('hearth_dev'); dev=null; conn='idle'; transport=null; clearInterval(poll); render();
}

/* ---------------- network ---------------- */
async function tf(url,ms){
  const c=new AbortController(); let t;
  const to=new Promise((_,rej)=>{t=setTimeout(()=>{c.abort();rej(new Error('timeout'))},ms||4000)});
  try{return await Promise.race([fetch(url,{signal:c.signal,cache:'no-store'}),to])}finally{clearTimeout(t)}
}
async function findBase(){
  hostedBy=null;
  if(location.protocol.startsWith('http')){
    try{const j=await (await tf('/info',1500)).json(); if(j.hearth){hostedBy=j.id; base=''; return true}}catch(e){}
  }
  if(!dev) return false;
  const h=hostOverride||('hearth-'+dev.id.toLowerCase()+'.local');
  base='http://'+h;
  try{const j=await (await tf(base+'/info',3500)).json(); return !!(j.hearth&&j.id===dev.id)}catch(e){return false}
}
async function authed(path,cmd){
  const c=await tf(base+'/challenge'); if(c.status===429) throw new Error('locked');
  const n=(await c.json()).n;
  const sig=hex(hmac(unhex(dev.ctl),enc(n+'|'+cmd)));
  const r=await tf(base+path+(path.includes('?')?'&':'?')+'n='+n+'&sig='+sig);
  if(r.status===401) throw new Error('auth'); if(r.status===429) throw new Error('locked');
  if(!r.ok) throw new Error('http'); return r.json();
}
function onErr(e){
  conn=e.message==='auth'?'badkey':e.message==='locked'?'locked':'fail';
  if(conn==='badkey') toast('Wrong key for this device'); if(conn==='locked') toast('Too many attempts — wait 1 minute');
  render();
}
async function connect(){
  if(!dev){render();return}
  conn='connecting'; render();
  if(!await findBase()){conn='fail';render();return}
  if(hostedBy&&hostedBy!==dev.id){conn='mismatch';render();return}
  try{hw=await authed('/status','STATUS'); conn='ok'; transport='wifi'; clearInterval(poll);
      poll=setInterval(refresh,6000); render()}catch(e){onErr(e)}
}
async function refresh(){
  if(document.hidden||transport!=='wifi'||conn!=='ok')return;
  try{hw=await authed('/status','STATUS'); render()}catch(e){onErr(e)}
}
async function send(k,v){
  if(transport==='ble') return bleSend(k.toUpperCase()+':'+v);
  return authed('/set?device='+k+'&state='+v, k.toUpperCase()+':'+v);
}
async function act(k){
  if(conn!=='ok'){toast('Not connected');return}
  const v=hw[k]?0:1;
  try{const j=await send(k,v); if(j) hw=j; else hw[k]=v; render()}catch(e){onErr(e)}
}

/* ---------------- Bluetooth (secure contexts only) ---------------- */
async function bleConnect(){
  try{
    conn='connecting'; render();
    const d=await navigator.bluetooth.requestDevice({filters:[{name:'Hearth-'+dev.id}],optionalServices:[SERVICE]});
    const s=await (await d.gatt.connect()).getPrimaryService(SERVICE);
    ble={d,cmd:await s.getCharacteristic(CMD_UUID),nonce:await s.getCharacteristic(NONCE_UUID),state:await s.getCharacteristic(STATE_UUID)};
    await ble.state.startNotifications();
    ble.state.addEventListener('characteristicvaluechanged',e=>{try{const j=JSON.parse(dec(e.target.value)); if(j.auth!==0){hw=j;render()}}catch(x){}});
    d.addEventListener('gattserverdisconnected',()=>{if(transport==='ble'){conn='fail';render()}});
    transport='ble'; clearInterval(poll);
    await bleSend('HELLO:1'); conn='ok'; render();
  }catch(e){conn='fail';toast('Bluetooth: '+(e.message||e));render()}
}
async function bleSend(cmd){
  const n=dec(await ble.nonce.readValue());
  const sig=hex(hmac(unhex(dev.ctl),enc(n+'|'+cmd)));
  await ble.cmd.writeValue(enc(cmd+'|'+n+'|'+sig));
}

/* ---------------- QR scan (needs camera => secure context) ---------------- */
async function scanQR(){
  if(!('BarcodeDetector' in window)||!window.isSecureContext||!navigator.mediaDevices){toast('Camera scan not available here — type the key');return}
  let stream; try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}})}catch(e){toast('Camera blocked');return}
  const ov=document.createElement('div'); ov.className='scan';
  ov.innerHTML='<video playsinline muted></video><button class="btn b-gh">Cancel</button>';
  document.body.appendChild(ov); const v=ov.querySelector('video'); v.srcObject=stream; await v.play();
  const det=new BarcodeDetector({formats:['qr_code']}); let live=true;
  const stop=()=>{live=false;stream.getTracks().forEach(t=>t.stop());ov.remove()};
  ov.querySelector('button').onclick=stop;
  (async function loop(){
    while(live){
      try{const r=await det.detect(v); if(r.length){const p=parseKey(r[0].rawValue); if(p){stop();addDevice(p);connect();return}}}catch(e){}
      await new Promise(r=>setTimeout(r,250));
    }
  })();
}
function addFromInput(){
  const p=parseKey(document.getElementById('key').value);
  if(!p){toast('Key looks wrong — 18 characters like A3F21C-7K3M-9QXD-4TRB');return}
  const h=document.getElementById('host0'); if(h&&h.value.trim()){hostOverride=h.value.trim();localStorage.setItem('hearth_host',hostOverride)}
  addDevice(p); connect();
}

/* ---------------- UI ---------------- */
function toast(m){
  let t=document.getElementById('toast'); if(!t){t=document.createElement('div');t.id='toast';t.className='toast';document.body.appendChild(t)}
  t.textContent=m;t.style.display='block';clearTimeout(toastT);toastT=setTimeout(()=>t.style.display='none',2600);
}
function setTab(t){tab=t;document.getElementById('t-home').classList.toggle('a',t==='home');document.getElementById('t-set').classList.toggle('a',t==='settings');render()}
function pill(){
  const m={ok:['p-ok','LIVE · '+(transport==='ble'?'BLUETOOTH':'WI-FI')],connecting:['p-warn','CONNECTING…'],fail:['p-bad','OFFLINE'],
           badkey:['p-bad','WRONG KEY'],locked:['p-warn','LOCKED OUT 1 MIN'],mismatch:['p-bad','DIFFERENT DEVICE'],idle:['p-idle','NOT CONNECTED']};
  const x=m[conn]||m.idle; return '<span class="pill '+x[0]+'">'+x[1]+'</span>';
}
function devCard(d){
  const off=conn!=='ok', on=d.type==='lock'?!hw.lock:!!hw[d.k];
  const nolock=d.type==='lock'&&!hw.lockEnabled;
  let body;
  if(d.type==='lock'){
    body=nolock?'<div class="sub mono" style="font-size:11px">Relay not wired yet</div>':
      '<button class="lock" '+(off?'disabled':'')+' onclick="act(\'lock\')" style="background:'+(hw.lock?'#4ADE8018':'#FFB45418')+';color:'+(hw.lock?'var(--green)':'var(--amber)')+'">'+(hw.lock?'🔒 Locked — tap to unlock':'🔓 Unlocked — tap to lock')+'</button>';
  } else body='<div class="row"><span class="sub mono" style="font-size:11px">'+(hw[d.k]?'Active':'Standby')+'</span><button class="tg'+(hw[d.k]?' on':'')+'" '+(off?'disabled':'')+' onclick="act(\''+d.k+'\')" aria-label="toggle '+d.name+'"><i></i></button></div>';
  return '<div class="card" style="opacity:'+(off||nolock?.55:1)+'"><div class="row" style="margin-bottom:12px"><div class="head"><div class="ic" style="background:'+(on&&!off?'#FFB45422':'var(--surface)')+'">'+d.icon+'</div><div><div class="name">'+d.name+'</div><div class="meta mono">'+d.room.toUpperCase()+'</div></div></div></div>'+body+'</div>';
}
function home(){
  if(!dev) return '<h1>Welcome to Hearth</h1><div class="sub">Let\'s add your first device.</div>'+
    '<div class="card fade" style="margin-top:18px"><div class="name">Set up a new device</div>'+
    '<ol class="steps"><li>Plug in the Hearth ESP32</li><li><b>Scan the QR on its label</b> with your phone camera — your phone joins <b>Hearth-XXXXXX</b></li><li>Choose your home Wi-Fi on the page that opens</li><li>Tap the link it shows — you\'re done</li></ol></div>'+
    '<div class="card fade"><div class="name">Already set up? Add the key</div><div class="sub" style="margin-top:2px">Printed on the label (or scan the same QR)</div>'+
    '<input type="text" id="key" placeholder="A3F21C-7K3M-9QXD-4TRB" autocomplete="off" autocapitalize="characters" spellcheck="false">'+
    '<div class="sub" style="margin-top:12px;font-size:12px">Device address — only if hearth-xxxxxx.local doesn\'t work (shown on the setup page)</div>'+
    '<input type="text" class="host" id="host0" placeholder="192.168.1.50 (optional)" autocomplete="off" spellcheck="false">'+
    '<div class="row" style="margin-top:12px"><button class="btn b-pri" onclick="addFromInput()">Add device</button>'+(('BarcodeDetector' in window&&window.isSecureContext)?'<button class="btn b-gh" onclick="scanQR()">📷 Scan QR</button>':'')+'</div></div>';
  let h='<div class="row" style="margin:8px 0 16px"><div><h1 style="margin:0">Hearth '+dev.id+'</h1><div class="sub" style="margin-top:3px">'+pill()+'</div></div></div>';
  if(conn==='fail') h+='<div class="card"><div class="name">Can\'t reach your Hearth</div><div class="sub" style="margin:6px 0 12px;line-height:1.5">Make sure this phone is on the same Wi-Fi as the device. If it just restarted, wait ~20 seconds.</div><div class="row"><button class="btn b-pri" onclick="connect()">Try again</button>'+(canBle?'<button class="btn b-bt" onclick="bleConnect()">Use Bluetooth</button>':'')+'</div></div>';
  if(conn==='badkey') h+='<div class="card"><div class="name">That key doesn\'t match this device</div><div class="sub" style="margin:6px 0 12px">Check the label and add it again.</div><button class="btn b-red" onclick="forget()">Remove &amp; re-add</button></div>';
  if(conn==='mismatch') h+='<div class="card"><div class="name">This page belongs to a different Hearth ('+esc(hostedBy)+')</div><div class="sub" style="margin:6px 0 12px">Your saved key is for '+esc(dev.id)+'.</div><button class="btn b-red" onclick="forget()">Remove saved key</button></div>';
  return h+'<div class="fade">'+DEVS.map(devCard).join('')+'</div>';
}
function settings(){
  return '<h1 style="margin-bottom:14px">Settings</h1>'+
  '<div class="card"><div class="row"><div class="head"><div class="ic">🔐</div><div><div class="name">Device</div><div class="meta mono">'+(dev?esc(dev.id):'NONE')+'</div></div></div>'+pill()+'</div>'+
  (dev?'<div class="row" style="margin-top:14px"><button class="btn b-gh" onclick="connect()">Reconnect</button>'+(canBle?'<button class="btn b-bt" onclick="bleConnect()">Bluetooth</button>':'')+'<button class="btn b-red" onclick="forget()">Remove</button></div>':'')+'</div>'+
  (dev&&!hostedBy?'<div class="card"><div class="name">Advanced: device address</div><div class="sub" style="margin:4px 0 0">Only if hearth-'+esc(dev.id.toLowerCase())+'.local doesn\'t resolve (some Android phones). Use the IP shown on the setup page.</div><input type="text" class="host" id="host" placeholder="192.168.1.50" value="'+esc(hostOverride)+'" onchange="hostOverride=this.value.trim();localStorage.setItem(\'hearth_host\',hostOverride)"></div>':'')+
  '<div class="card"><div class="name">Security</div><ul class="steps" style="margin-top:6px"><li>Every command is signed with a key that never leaves your devices</li><li>Each signature works once (no replay)</li><li>5 wrong attempts lock the device for 1 minute</li><li>Key is stored only in this browser</li></ul></div>'+
  '<div class="card"><div class="name">Reset Wi-Fi</div><div class="sub" style="margin-top:4px;line-height:1.5">Hold the <b>BOOT</b> button on the ESP32 for 5 seconds. It forgets your Wi-Fi and shows the setup network again.</div></div>';
}
function render(){
  const c=document.getElementById('content'); c.innerHTML=tab==='home'?home():settings();
  document.getElementById('net').textContent=conn==='ok'?(transport==='ble'?'🔵':'📶'):'';
}
setInterval(()=>{document.getElementById('clock').textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})},15000);
document.getElementById('clock').textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});

/* ---------------- boot ---------------- */
(function init(){
  if(location.hash.indexOf('#k=')===0){
    const p=parseKey(decodeURIComponent(location.hash.slice(3)));
    if(p) addDevice(p);
    history.replaceState(null,'',location.pathname+location.search);   // remove key from URL/history
  }
  render(); if(dev) connect();
})();
</script>
